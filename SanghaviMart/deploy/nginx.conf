server {
    listen 443 ssl;
    server_name sanghavimart.example.com;
    ssl_certificate /etc/letsencrypt/live/sanghavimart.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sanghavimart.example.com/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
