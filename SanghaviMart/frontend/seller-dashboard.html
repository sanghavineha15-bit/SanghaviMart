<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seller Dashboard - SanghaviMart</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="brand"><span>🛒</span><span>SanghaviMart</span></a>
      <nav class="nav-links"><a href="/products.html" class="nav-link">Catalog</a></nav>
    </div>
  </header>
  <main class="container">
    <h1>Seller Dashboard</h1>
    <h2>My Listings</h2>
    <div id="list"><p>Loading...</p></div>
    <h2>Add / Edit Product</h2>
    <form onsubmit="return save(event)">
      <input type="hidden" id="pid" />
      <label>Name: <input id="name" required /></label><br/>
      <label>Description: <input id="desc" required /></label><br/>
      <label>Price: <input id="price" type="number" step="0.01" min="0.01" required /></label><br/>
      <label>Stock: <input id="stock" type="number" min="0" value="10" required /></label><br/>
      <label>Category ID: <input id="cat" type="number" min="1" value="1" required /></label><br/>
      <label>Image URL: <input id="img" /></label><br/>
      <button class="btn btn-primary" type="submit">Save Listing</button>
      <button type="button" onclick="resetForm()">Cancel</button>
    </form>
    <h2>Incoming Orders</h2>
    <div id="orders"><p>Loading...</p></div>
  </main>
  <script src="/static/js/api.js"></script>
  <script>
    const me = api.getUser();
    if (!me) window.location.href = '/login-seller.html';
    async function load() {
      try {
        const d = await api.getProducts({ seller_id: me.id });
        // Server is authoritative; client-side filter is display-only.
        const mine = (d.products || []).filter(p => Number(p.seller_id) === Number(me.id));
        document.getElementById('list').innerHTML = mine.map(p => `
          <div>${escapeHtml(p.name)} — $${Number(p.price).toFixed(2)} — stock ${Number(p.stock_quantity)}
          <button onclick="edit(${Number(p.id)})">Edit</button>
          <button onclick="del(${Number(p.id)})">Delete</button></div>`).join('') || '<p>No listings yet.</p>';
      } catch (e) { document.getElementById('list').innerHTML = `<p>Failed: ${escapeHtml(e.message)}</p>`; }
      try {
        const o = await api.getOrders();
        document.getElementById('orders').innerHTML = (o.orders || []).map(x => `
          <div>${escapeHtml(x.order_number)} — ${escapeHtml(x.buyer_name)} — $${Number(x.total_amount).toFixed(2)} — ${escapeHtml(x.status)}</div>`).join('') || '<p>No incoming orders.</p>';
      } catch (e) { document.getElementById('orders').innerHTML = `<p>Failed: ${escapeHtml(e.message)}</p>`; }
    }
    async function save(ev) {
      ev.preventDefault();
      const body = {
        name: document.getElementById('name').value,
        description: document.getElementById('desc').value,
        price: Number(document.getElementById('price').value),
        stock_quantity: Number(document.getElementById('stock').value),
        category_id: Number(document.getElementById('cat').value),
        image_url: document.getElementById('img').value,
      };
      try {
        const pid = document.getElementById('pid').value;
        if (pid) await api.updateProduct(Number(pid), body);
        else await api.addProduct(body);
        resetForm(); load();
      } catch (e) { alert(e.message); }
      return false;
    }
    async function edit(id) {
      const d = await api.getProductById(id);
      const p = d.product;
      document.getElementById('pid').value = p.id;
      document.getElementById('name').value = p.name;
      document.getElementById('desc').value = p.description;
      document.getElementById('price').value = p.price;
      document.getElementById('stock').value = p.stock_quantity;
      document.getElementById('cat').value = p.category_id;
      document.getElementById('img').value = p.image_url;
      window.scrollTo(0, document.body.scrollHeight);
    }
    async function del(id) {
      if (!confirm('Delete listing?')) return;
      try { await api.deleteProduct(id); load(); } catch (e) { alert(e.message); }
    }
    function resetForm() { document.getElementById('pid').value = ''; document.querySelector('form').reset(); }
    load();
  </script>
</body>
</html>
